name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - run: dotnet restore UniversalInput.slnx
      - run: dotnet build UniversalInput.slnx -c Release --no-restore
      - run: dotnet test UniversalInput.slnx -c Release --no-build --no-restore --logger trx --results-directory artifacts/test-results
      - run: dotnet pack src/UniversalInput.Contracts/UniversalInput.Contracts.csproj -c Release --no-build --no-restore -o artifacts/packages
